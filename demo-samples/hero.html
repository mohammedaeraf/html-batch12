<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .hero {
        background-image: url("img/office-team.jpg");
        /* vh - viewport height */
        min-height: 100vh;
        background-position: center;
        background-size: cover;
      }
      .overlay {
        min-height: 100vh;
        background-color: rgba(17, 17, 17, 0.722);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="overlay p-5">
        <div class="row">
          <div class="col-lg-7 p-4">
            <h1 class="fw-bold display-4 text-white pt-5 mb-4">
              Grow Your Brand With Powerful Digital Solutions
            </h1>
            <p class="lead text-white mb-5">
              We help businesses grow through Digital Marketing, Graphic Design,
              and Professional Video Editing.
            </p>
            <div>
              <a href="" class="btn btn-primary btn-lg me-3">Our Services</a>
              <a href="" class="btn btn-outline-light btn-lg">Contact Us</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
