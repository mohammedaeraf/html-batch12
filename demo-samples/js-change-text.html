<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Change Text</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function changeHeading() {
        document.getElementById("page-heading").innerHTML =
          "JavaScript has changed this text!";
      }
    </script>
  </head>
  <body>
    <h2 id="page-heading" class="text-center text-danger my-4">
      Welcome to JavaScript!
    </h2>
    <button class="btn btn-danger btn-lg ms-5" onclick="changeHeading()">
      Change Text
    </button>
  </body>
</html>
