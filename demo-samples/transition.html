<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      p {
        transition: 0.4s;
      }
      p:hover {
        color: red;
      }
      .my-btn {
        border: none;
        background-color: royalblue;
        border-radius: 4px;
        color: white;
        padding: 5px 50px;
        transition: 0.45s; /* make the effect smoother */
      }
      .my-btn:hover {
        background-color: rgb(8, 60, 218);
        /* transform: scale(1.1); */
        /* transform: rotate(-2deg); */
        transform: translateY(10px);
      }
    </style>
  </head>
  <body>
    <div class="container py-5 text-center">
      <h2 class="text-primary">Transition Demo</h2>
      <p>Transition allows an element to change its state with smooth effect</p>
      <button class="my-btn">Hover on me</button>
      <button class="my-btn">I am also here..</button>
    </div>
  </body>
</html>
