<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Change Text</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function changeStyle() {
        // remove class 'text-info'
        document.getElementById("page-heading").classList.remove("text-info");

        // add class 'text-success'
        document.getElementById("page-heading").classList.add("text-success");
      }
    </script>
  </head>
  <body>
    <h2 id="page-heading" class="text-center text-info my-4">
      Welcome to JavaScript!
    </h2>
    <button class="btn btn-warning btn-lg ms-5" onclick="changeStyle()">
      Change Style
    </button>
  </body>
</html>
