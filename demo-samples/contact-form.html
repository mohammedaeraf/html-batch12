<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h2 class="text-center pt-5 pb-3">Contact Us</h2>
      <p class="text-center mb-5">
        Please send us your message and we will reply back to you within 24
        hours
      </p>
      <div class="row">
        <div class="col-lg-6">
          <form action="https://formspree.io/f/xrpzewgz" method="POST">
            <input
              type="text"
              name="userName"
              id="userName"
              placeholder="Your Name"
              class="form-control mb-3"
            />
            <input
              type="email"
              name="userEmail"
              id="userEmail"
              placeholder="Your Email"
              class="form-control mb-3"
            />
            <input
              type="text"
              name="phoneNumber"
              id="phoneNumber"
              class="form-control mb-3"
              placeholder="Your Phone Number with Country Code"
            />

            <input
              type="text"
              name="subject"
              id="subject"
              placeholder="Subject"
              class="form-control mb-3"
            />
            <textarea
              name="message"
              id="message"
              placeholder="Your Message"
              rows="4"
              class="form-control mb-4"
            ></textarea>
            <button class="btn btn-primary btn-lg w-100">Send Message</button>
          </form>
        </div>
        <div class="col-lg-6">
          <div class="bg-light p-3 rounded h-100">
            <p>Phone</p>
            <p>Address</p>
            <p>Number</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
