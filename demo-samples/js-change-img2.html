<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Image</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function changeImage(imageSrc) {
        document.getElementById("destination-img").src = imageSrc;
      }
    </script>
  </head>
  <body>
    <div class="my-3 p-4">
      <img
        id="destination-img"
        src="img/munnar.jpg"
        alt=""
        width="400px"
        class="img-fluid rounded shadow d-block mb-4"
      />
      <button
        class="btn btn-primary btn-lg me-2"
        onclick="changeImage('img/taj-mahal.jpg')"
      >
        Taj Mahal
      </button>
      <button
        class="btn btn-primary btn-lg"
        onclick="changeImage('img/munnar.jpg')"
      >
        Munnar
      </button>
    </div>
  </body>
</html>
