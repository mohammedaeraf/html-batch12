<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JavaScript Demo</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container my-5">
      <h1 class="text-center text-primary mb-4">JavaScript Demo</h1>

      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title">Web Design Course</h3>

          <p>Click the buttons below to show or hide the course details.</p>

          <button class="btn btn-success me-2" onclick="showDetails()">
            Show Details
          </button>

          <button class="btn btn-danger" onclick="hideDetails()">
            Hide Details
          </button>

          <div id="courseDetails" class="alert alert-info mt-4 d-none">
            <h5>Course Information</h5>

            <ul>
              <li>HTML5</li>

              <li>CSS3</li>

              <li>Bootstrap</li>

              <li>JavaScript</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      function showDetails() {
        document.getElementById("courseDetails").classList.remove("d-none");
      }

      function hideDetails() {
        document.getElementById("courseDetails").classList.add("d-none");
      }
    </script>
  </body>
</html>
